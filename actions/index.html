<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웨투위 Action Item 목록</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1420px;margin:auto;padding:24px}h1{margin:0;font-size:27px}header{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}.sub{color:#63748c;font-size:13px;margin:6px 0}.panel{background:white;border:1px solid #dde5f0;border-radius:14px;padding:20px;box-shadow:0 2px 12px #19304a09}a{color:#2357a8;text-decoration:none}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{background:white;border:1px solid #cfdceb;padding:10px 13px;border-radius:9px;font-size:13px}table{border-collapse:collapse;min-width:1150px;width:100%;font-size:13px}th{background:#eef3fb;text-align:left;padding:12px 9px;white-space:nowrap}td{border-top:1px solid #e7edf5;padding:11px 9px;vertical-align:top}input,select{font:inherit;padding:7px;border:1px solid #cbd6e4;border-radius:7px;max-width:100%}.scroll{overflow-x:auto}.pill{border-radius:6px;background:#ecf3ff;color:#2356a0;padding:4px 6px;font-weight:700;font-size:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.blue{background:#2563eb}.green{background:#16a34a}.yellow{background:#eab308}.red{background:#dc2626}.legend{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 15px;font-size:13px;align-items:center}.muted{color:#66788d}.warning{color:#7b5413;background:#fff7e4;border:1px solid #f5dfad;padding:10px;border-radius:9px;margin:10px 0}@media(max-width:700px){main{padding:12px}header{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><div><h1>Action Item 목록</h1><p class="sub">회의록에서 추출한 관리 검토용 후보 · JSON 자동 갱신</p></div><nav class="nav"><a href="../minutes/">회의록 페이지</a><a href="../actions/">Action Item 목록</a></nav></header><div class="legend"><strong>신호등</strong><span><i class="dot blue"></i>완료</span><span><i class="dot green"></i>진행 중</span><span><i class="dot yellow"></i>확인 필요</span><span><i class="dot red"></i>지연</span></div><section class="panel"><div class="warning">이번 단계는 회의록 → Action Item 자동 추출 검증입니다. 후보 항목은 승인 전 상태이며, 다른 사용자의 입력을 저장하는 공동 편집 기능은 아직 없습니다.</div><p id="count" class="sub">불러오는 중...</p><div class="scroll"><table><thead><tr><th>발생 주차<br><select id="week"><option value="">전체</option></select></th><th>제목<br><input id="title" placeholder="검색"></th><th>내용<br><input id="content" placeholder="검색"></th><th>담당부서<br><select id="department"><option value="">전체</option></select></th><th>담당자<br><select id="owner"><option value="">전체</option></select></th><th>납기<br><input id="due" placeholder="검색"></th><th>신호등<br><select id="signal"><option value="">전체</option></select></th><th>진행 사항<br><input id="progress" placeholder="검색"></th></tr></thead><tbody id="list"></tbody></table></div></section></main><script>
const fields=['week','title','content','department','owner','due','signal','progress'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[];let colors={'완료':'blue','진행 중':'green','확인 필요':'yellow','지연':'red'};
function render(){let match=data.filter(x=>fields.every(f=>{let q=document.getElementById(f).value.trim().toLowerCase();return !q||String(x[f]??'').toLowerCase().includes(q)}));document.getElementById('count').textContent=`${match.length}건 / 전체 ${data.length}건 · 검토 대기`;document.getElementById('list').innerHTML=match.map(x=>`<tr><td><span class="pill">${esc(x.week)}</span></td><td><b>${esc(x.title)}</b><p class="sub">${esc(x.review||'검토 대기')}</p></td><td>${esc(x.content)}</td><td>${esc(x.department)}</td><td>${esc(x.owner)}</td><td>${esc(x.due)}</td><td><i class="dot ${colors[x.signal]||'yellow'}"></i>${esc(x.signal)}</td><td>${esc(x.progress)}</td></tr>`).join('')||'<tr><td colspan="8">조건에 맞는 항목이 없습니다.</td></tr>'}
fetch('data/items.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(doc=>{data=doc.items||[];['week','department','owner','signal'].forEach(f=>{const el=document.getElementById(f);[...new Set(data.map(x=>x[f]).filter(Boolean))].sort().forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=v;el.appendChild(opt)})});fields.forEach(f=>document.getElementById(f).addEventListener('input',render));render()}).catch(e=>{document.getElementById('count').textContent='JSON을 읽지 못했습니다: '+e.message});
</script></body></html>
