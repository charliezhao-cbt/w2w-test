<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웨투위 주간 회의록</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1420px;margin:auto;padding:24px}h1{margin:0;font-size:27px}header{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:20px}.sub{color:#63748c;font-size:13px;margin:6px 0}.panel{background:white;border:1px solid #dde5f0;border-radius:14px;padding:20px;box-shadow:0 2px 12px #19304a09}a{color:#2357a8;text-decoration:none}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{background:white;border:1px solid #cfdceb;padding:10px 13px;border-radius:9px;font-size:13px}table{border-collapse:collapse;min-width:1150px;width:100%;font-size:13px}th{background:#eef3fb;text-align:left;padding:12px 9px;white-space:nowrap}td{border-top:1px solid #e7edf5;padding:11px 9px;vertical-align:top}input,select{font:inherit;padding:7px;border:1px solid #cbd6e4;border-radius:7px;max-width:100%}.scroll{overflow-x:auto}.pill{border-radius:6px;background:#ecf3ff;color:#2356a0;padding:4px 6px;font-weight:700;font-size:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.blue{background:#2563eb}.green{background:#16a34a}.yellow{background:#eab308}.red{background:#dc2626}.legend{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 15px;font-size:13px;align-items:center}.muted{color:#66788d}.warning{color:#7b5413;background:#fff7e4;border:1px solid #f5dfad;padding:10px;border-radius:9px;margin:10px 0}@media(max-width:700px){main{padding:12px}header{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><div><h1>웨투위 회의록</h1><p class="sub">주차별 원본 회의록 · W40~W45 초기 등록</p></div><nav class="nav"><a href="../minutes/">회의록 페이지</a><a href="../actions/">Action Item 목록</a></nav></header><section class="panel"><h2>회의록 목록</h2><div id="records"></div><p class="sub">W46 파일이 meetings 폴더에 추가되면 목록에 표시됩니다.</p></section></main><script>
const weeks=[40,41,42,43,44,45,46];const target=document.getElementById('records');Promise.all(weeks.map(async w=>{let url=`meetings/2026-W${w}.html`;try{let r=await fetch(url,{method:'HEAD',cache:'no-store'});return r.ok?`<p><a href="${url}">2026 W${w} 웨투위 회의록 ↗</a></p>`:''}catch{return ''}})).then(rows=>{target.innerHTML=rows.join('')||'회의록 목록을 불러오지 못했습니다.'});
</script></body></html>
