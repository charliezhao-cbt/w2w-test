<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W2W 주간 회의록</title>
  <style>
    :root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17243a;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px 20px 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
    h1{font-size:28px;margin:0}h2{margin:0;font-size:21px}.sub{color:#64748b;font-size:13px;margin:7px 0 0}
    .nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.original{display:inline-block;padding:10px 13px;background:#fff;border:1px solid #d7e0eb;border-radius:9px;text-decoration:none;color:#2257a5;font-size:13px}
    .panel{background:#fff;border:1px solid #dde5f0;border-radius:15px;padding:22px;margin-bottom:20px;box-shadow:0 3px 16px #19304a08}
    .row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}
    .tag{display:inline-block;background:#eaf2ff;color:#235ca5;border-radius:7px;padding:5px 8px;font-weight:700;font-size:12px}
    iframe{display:block;border:1px solid #e0e7f1;border-radius:10px;background:#fff;width:100%;height:500px;min-height:300px}
    .archive{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .archive a{display:block;text-decoration:none;padding:13px 15px;border:1px solid #dce6f0;background:#f8fafd;border-radius:9px;color:#2257a5;font-weight:600}
    .archive a:hover,.nav a:hover{background:#edf4fe}.message{color:#66788d;line-height:1.7}
    @media(max-width:700px){main{padding:16px 12px 40px}.panel{padding:15px}h1{font-size:24px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>W2W 주간 회의록</h1><p class="sub">가장 최근 회의록은 본문에, 이전 회의록은 아래 링크에서 확인합니다.</p></div>
    <nav class="nav"><a href="../minutes/">회의록</a><a href="../actions/">Action Item 관리</a></nav>
  </header>
  <section class="panel" aria-labelledby="latest-heading">
    <div class="row">
      <div><span class="tag">최신 회의록</span><h2 id="latest-heading" style="margin-top:9px">불러오는 중...</h2></div>
      <a class="original" id="original-link" href="#" hidden>원본 회의록 열기 ↗</a>
    </div>
    <div id="latest-message" class="message">등록된 회의록을 확인하고 있습니다.</div>
    <iframe id="latest-frame" title="최신 주간 회의록 본문" loading="eager" hidden></iframe>
  </section>
  <section class="panel" aria-labelledby="archive-heading">
    <h2 id="archive-heading">지난 회의록</h2>
    <p class="sub" style="margin-bottom:18px">주차를 선택하면 해당 회의록 원본을 열 수 있습니다.</p>
    <div class="archive" id="archive"><p class="message">목록을 불러오는 중...</p></div>
  </section>
</main>
<script>
(function(){
  'use strict';
  // W46가 등록되면 이 파일을 수정하지 않아도 가장 큰 주차가 최신으로 선택됩니다.
  const yearsAndWeeks=[...Array.from({length:14},(_,i)=>({year:2026,week:i+40}))];
  const heading=document.getElementById('latest-heading');
  const message=document.getElementById('latest-message');
  const frame=document.getElementById('latest-frame');
  const original=document.getElementById('original-link');
  const archive=document.getElementById('archive');
  async function exists(record){
    const url=`meetings/${record.year}-W${record.week}.html`;
    try{
      const response=await fetch(url,{method:'HEAD',cache:'no-store'});
      return response.ok?{...record,url}:null;
    }catch(_error){return null;}
  }
  function resizeFrame(){
    try{
      const doc=frame.contentDocument;
      if(doc && doc.body){
        frame.style.height=Math.max(340,doc.documentElement.scrollHeight,doc.body.scrollHeight)+20+'px';
      }
    }catch(_error){frame.style.height='650px';}
  }
  frame.addEventListener('load',()=>{
    resizeFrame();
    // GitHub Pages에서 동일 출처 회의록을 보여줄 때 원본 내용 높이에 맞춥니다.
    try{const doc=frame.contentDocument;if(doc && typeof ResizeObserver!=='undefined')new ResizeObserver(resizeFrame).observe(doc.body);}catch(_error){}
  });
  Promise.all(yearsAndWeeks.map(exists)).then(results=>{
    const available=results.filter(Boolean).sort((a,b)=>b.year-a.year || b.week-a.week);
    if(!available.length){heading.textContent='등록된 회의록 없음';message.textContent='회의록 파일을 확인하지 못했습니다. GitHub Pages 배포 또는 minutes/meetings 폴더를 확인해 주세요.';archive.textContent='지난 회의록 없음';return;}
    const latest=available[0];
    heading.textContent=`${latest.year}년 W${latest.week} 회의록`;
    original.href=latest.url;original.hidden=false;
    message.hidden=true;frame.src=latest.url;frame.hidden=false;
    const previous=available.slice(1);
    archive.replaceChildren();
    if(!previous.length){archive.textContent='아직 이전 회의록이 없습니다.';return;}
    previous.forEach(record=>{
      const link=document.createElement('a');link.href=record.url;link.textContent=`${record.year}년 W${record.week} 회의록 ↗`;
      archive.appendChild(link);
    });
  }).catch(()=>{
    heading.textContent='회의록 조회 오류';message.textContent='회의록 목록을 가져오는 중 문제가 발생했습니다. 잠시 후 새로고침해 주세요.';
    archive.textContent='목록을 불러올 수 없습니다.';
  });
})();
</script>
</body>
</html>
